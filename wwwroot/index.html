<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>ORBCOMM SC1000 Tracking</title>

    <link
      href="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/site.css?v=2" />
    <link rel="stylesheet" href="/css/topbar.css?v=5" />
    <link rel="stylesheet" href="/css/popup.css?v=2" />
  </head>

  <body>
    <div class="app-shell">
      <!-- TOP -->
      <header id="topbar"></header>

      <!-- BOTTOM -->
      <div class="app-content">
        <!-- LEFT -->
        <aside class="sidebar">
          <section class="device-summary">
            <strong id="device-count">0</strong>
            <span>thiết bị có vị trí</span>
          </section>

          <section>
            <h2>Thiết bị</h2>

            <ul id="device-list" class="device-list"></ul>
          </section>
        </aside>

        <!-- RIGHT -->
        <section id="map" aria-label="Bản đồ vị trí thiết bị"></section>
      </div>
    </div>

    <script src="https://unpkg.com/maplibre-gl@5.7.1/dist/maplibre-gl.js"></script>

    <script type="module" src="/js/app.js?v=3"></script>
  </body>
</html>
